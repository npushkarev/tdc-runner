# Все тесты решения, кроме web-набора.
#
# ВАЖНО: этому набору нужен образ, собранный из ВСЕГО решения, а не из одного
# csproj. То есть в Dockerfile вместо
#     dotnet build ./tests/<один проект>.csproj -c Release
# должно быть
#     dotnet build Elara.OpenIde.Backend.slnx -c Release
# Иначе dotnet test с ключом --no-build не найдёт бинарники остальных проектов.
#
# Web.IntegrationTests исключён фильтром: он создаёт контейнеры через
# Docker.DotNet, а такие наборы пока не поддерживаются.
services:
  tests:
    image: proget.inc.elara.local/your-feed/openide-all-tests:${TESTS_IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - READ_DB
      - WRITE_DB
    command:
      - dotnet
      - test
      - Elara.OpenIde.Backend.slnx
      - --no-build
      - -c
      - Release
      - --filter
      - FullyQualifiedName!~Backend.Web.IntegrationTests
      - --logger
      - trx;LogFileName=all.trx
      - --collect:XPlat Code Coverage
      - --results-directory
      - /test/output/results

  postgres:
    image: proget.inc.elara.local/main/library/postgres:18.1
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-test-data:
