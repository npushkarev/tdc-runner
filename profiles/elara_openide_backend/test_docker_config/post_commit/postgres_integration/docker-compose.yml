# Набор интеграционных тестов слоя Infrastructure (PostgreSQL).
# Кладётся в корень репозитория SCADA/elara_openide_backend.
#
# Отличия от вашего postgres-integration-tests-compose.yaml и почему:
#   build:          -> image:  тестовая машина не собирает образы и не получает
#                              исходники; образ собирает отдельная конфигурация
#                              сборки и публикует в ProGet
#   container_name:    убран   два прогона одновременно не уживутся, имена даёт
#                              система (они уникальны на запуск)
#   restart: always    убран   под тестовый прогон это бесконечный подъём
#                              упавшей базы
#   command:           добавлен  ваш CMD не выгружал отчёты наружу — три
#                                последних ключа это чинят
services:
  tests:
    # ЗАМЕНИТЬ your-feed: фид ProGet, куда публикуется образ с тестами.
    # Тег держим в .env.default, чтобы поднимать версию одной строкой.
    image: proget.inc.elara.local/your-feed/openide-postgres-integration-tests:${TESTS_IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy   # ждём готовности базы, а не старта контейнера
    environment:
      # значение без "=" берётся из .env.default
      - ASPNETCORE_ENVIRONMENT=Testing
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST=postgres       # к соседу по имени сервиса, не localhost
      - POSTGRES_PORT=5432
      - READ_DB
      - WRITE_DB
    command:
      - dotnet
      - test
      # Цель указана явно. Без неё dotnet test берёт .slnx из /app, то есть
      # результат зависит от того, что лежит в рабочем каталоге образа.
      - ./tests/Elara.OpenIde.Backend.Infrastructure.IntegrationTests/Elara.OpenIde.Backend.Infrastructure.IntegrationTests.csproj
      - --filter
      - Category=Integration&DbProvider=Npgsql
      - --no-build
      - -c
      - Release
      # ↓ ради этих трёх ключей всё и затевалось: без них отчёты остаются
      #   внутри контейнера и умирают вместе с ним
      - --logger
      - trx;LogFileName=integration.trx
      - --collect:XPlat Code Coverage
      - --results-directory
      - /test/output/results
      # Считаем покрытие только слоёв, которые эти тесты и проверяют.
      # Без фильтра в знаменатель попадают ВСЕ связанные сборки, и цифра
      # получается бессмысленной (на стенде вышло 4.44%).
      - --
      - DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[Elara.OpenIde.Backend.Infrastructure]*,[Elara.OpenIde.Backend.Application]*

  postgres:
    image: proget.inc.elara.local/main/library/postgres:18.1
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-test-data:
